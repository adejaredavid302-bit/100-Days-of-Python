<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="hero">
        <p class="eyebrow">A LITTLE CORNER OF THE INTERNET</p>
        <h1>My Blog</h1>
        <p class="hero-subtitle">Thoughts, stories, and ideas.</p>
    </header>
    <main class="container">
        {% for post in posts %}
        <article class="post-preview">
            <p class="post-number">STORY {{ loop.index }}</p>
            <h2>{{ post["title"] }}</h2>
            <p class="subtitle">{{ post["subtitle"] }}</p>
            <a class="read-link" href="{{ url_for('show_post', blog_id=post['id']) }}">Read →</a>
        </article>
        {% endfor %}
    </main>
    <footer class="site-footer">Made with Flask and Python</footer>
</body>
</html>
